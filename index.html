ection><section class='productos'><div class='grid'><div class='card'><div class='icono'>🍫</div><h3>Barrita Chocolate</h3><div class='price'>$1000</div><button onclick="agregar('Barrita Chocolate',1000)">Agregar</button></div><div class='card'><div class='icono'>🍏</div><h3>Barrita Manzana Verde</h3><div class='price'>$1000</div><button onclick="agregar('Barrita Manzana Verde',1000)">Agregar</button></div><div class='card'><div class='icono'>🥤</div><h3>Powerade Azul</h3><div class='price'>$2500</div><button onclick="agregar('Powerade Azul',2500)">Agregar</button></div><div class='card'><div class='icono'>⚡</div><h3>Powerade Rojo</h3><div class='price'>$2500</div><button onclick="agregar('Powerade Rojo',2500)">Agregar</button></div></div></section><div class='carrito' id='panel'><h2>🛒 Carrito</h2><div id='items'></div><div class='total'>Total: $<span id='total'>0</span></div><button onclick='comprar()'>Comprar</button></div><a class='whatsapp' href='https://wa.me/542615466940?text=Hola%20quiero%20hacer%20un%20pedido' target='_blank'>WhatsApp</a><script>let carrito=[];function agregar(nombre,precio){carrito.push({nombre,precio});actualizar()}function actualizar(){document.getElementById('count').innerText=carrito.length;let items=document.getElementById('items');items.innerHTML='';let total=0;carrito.forEach((p,index)=>{total+=p.precio;items.innerHTML+=`<div class='item'>${p.nombre} - $${p.precio}<button class='remove' onclick='eliminar(${index})'>Eliminar</button></div>`});document.getElementById('total').innerText=total}function eliminar(index){carrito.splice(index,1);actualizar()}function toggleCart(){let panel=document.getElementById('panel');panel.style.display=panel.style.display==='block'?'none':'block'}function comprar(){if(carrito.length===0){alert('Carrito vacío');return}let mensaje='Hola quiero pedir:%0A%0A';carrito.forEach(p=>{mensaje+=`- ${p.nombre} ($${p.precio})%0A`});let total=carrito.reduce((a,b)=>a+b.precio,0);mensaje+=`%0ATotal: $${total}`;window.open(`https://wa.me/542615466940?text=${mensaje}`,'_blank')}</script></body></html>
